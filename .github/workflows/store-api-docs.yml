name: store-api-docs

on:
  pull_request_target:
    branches: [3.x]
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/api/routes/**'
      - 'packages/api/src/Http/**'
      - 'packages/api/config/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Comment the Store API files to document
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[].filename | select(test("^packages/api/(routes|src/Http|config)/")) | "- `\(.)`"')

          body="<!-- store-api-docs -->
          This PR changes the Store API. Update the Store API pages of the docs (shopperlabs/docs, \`content/docs/3.x/(storefront)/store-api\`) before the release:

          $files"

          comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- store-api-docs -->"))) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi
